name: Market research (prep mode, all gift categories)
on:
  schedule: [{cron: '17 11 * * *'}]   # daily 11:17 UTC (7:17 AM ET)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect general niche signals (taxonomy.json categories, Wikipedia pageviews) + curated Etsy/gift sources
        run: python research/collect.py
        timeout-minutes: 20
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node research/backlog.js
        env: {TARGET: '5000', DAILY_CAP: '8'}
      - run: |
          git config user.name "robot-founder-research"; git config user.email "actions@users.noreply.github.com"
          git add research/market.json research/backlog.json research/curated.json
          if git diff --cached --quiet; then
            echo "No research file changes to commit"
            exit 0
          fi
          git commit -m "research: daily all-category niche signals $(date -u +%F)"
          # Pages deploys and other pushes often land while research runs; rebase then push.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i); pulling with rebase..."
            git pull --rebase --autostash origin main
            sleep $((i * 2))
          done
          echo "Failed to push research after retries" >&2
          exit 1
