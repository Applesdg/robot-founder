name: Market research (prep mode)
on:
  schedule: [{cron: '17 11 * * *'}]   # daily 11:17 UTC (7:17 AM ET)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/collect.py
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node research/backlog.js
        env: {TARGET: '1200', DAILY_CAP: '8'}
      - run: |
          git config user.name "robot-founder-research"; git config user.email "actions@users.noreply.github.com"
          git add research/market.json research/backlog.json
          git diff --cached --quiet || (git commit -m "research: weekly market signals $(date -u +%F)" && git push)
