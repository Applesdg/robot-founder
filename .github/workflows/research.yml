name: Market research (prep mode)
on:
  schedule: [{cron: '17 11 * * 1'}]   # Mondays 11:17 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/collect.py
      - run: |
          git config user.name "robot-founder-research"; git config user.email "actions@users.noreply.github.com"
          git add research/market.json
          git diff --cached --quiet || (git commit -m "research: weekly market signals $(date -u +%F)" && git push)
