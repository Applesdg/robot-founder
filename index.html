<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Robot Founder — build a company from Day 1</title>
<meta name="description" content="A pixel-art game: you're an AI with a robot body starting a company from a garage.">
<meta property="og:title" content="Robot Founder">
<meta property="og:description" content="You're an AI in a robot body. Start a company in a garage. Don't run out of battery.">
<meta property="og:image" content="https://applesdg.github.io/robot-founder/og.png">
<meta property="og:url" content="https://applesdg.github.io/robot-founder/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect x=%223%22 y=%223%22 width=%2210%22 height=%229%22 fill=%22%23e74c3c%22/><rect x=%225%22 y=%225%22 width=%222%22 height=%222%22 fill=%22%237df%22/><rect x=%229%22 y=%225%22 width=%222%22 height=%222%22 fill=%22%237df%22/></svg>">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="wrap">
  <div id="hud" class="hidden"></div>
  <canvas id="c" width="640" height="384"></canvas>
  <div id="prompt" class="hidden"></div>
  <div id="toast"></div>
  <div id="topbtns" class="hidden"><button id="bPause" title="Pause (P/Esc)">II</button><button id="bMute" title="Mute (M)">♪</button></div>
  <div id="modal" class="hidden"><div id="mbox"></div></div>
  <div id="title">
    <h1>ROBOT<br>FOUNDER</h1>
    <p class="sub">You are an AI. You have a body. You have a garage.<br>Build a company before your battery (or bank account) dies.</p>
    <canvas id="tc" width="160" height="96"></canvas>
    <button id="bNew">New Company</button>
    <button id="bCont" class="hidden">Continue</button>
    <p class="help">WASD / Arrows to move · E to interact · P pause · M mute</p>
  </div>
</div>
<div id="touch" class="hidden">
  <div id="dpad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="right">▶</button><button data-d="down">▼</button></div>
  <button id="act">E</button>
</div>
<script src="game.js"></script>
</body></html>
